<style>
.ob[aria-pressed="true"]{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<h2 class="sr-only">Interactive EUR/USD chart showing when and at what price market, limit and stop orders fill, on a calm day and on a news gap.</h2>
<div style="padding:1rem 0">
<div id="ot" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
<button class="ob" data-k="mb">Market buy</button><button class="ob" data-k="bl">Buy limit</button><button class="ob" data-k="bs">Buy stop</button><button class="ob" data-k="sl">Sell limit</button><button class="ob" data-k="ss">Sell stop</button>
</div>
<div id="sc" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
<button class="ob" data-s="calm">Calm day</button><button class="ob" data-s="news">News gap</button>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
<label for="lv" style="font-size:14px;color:var(--text-secondary)">Order price</label>
<input type="range" id="lv" min="-30" max="30" step="1" value="-15" style="flex:1">
<span id="lvo" style="font-size:14px;font-weight:500;min-width:64px"></span>
</div>
<svg viewBox="0 0 640 260" width="100%" role="img" aria-label="Price chart with order level">
<g id="grid"></g>
<line x1="64" x2="620" id="sl0" stroke="var(--text-muted)" stroke-dasharray="4 4" stroke-width="1"/>
<line x1="64" x2="620" id="ol" stroke-width="2"/>
<text id="olt" x="70" font-size="12"></text>
<polyline id="pl" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linejoin="round"/>
<circle id="cd" r="4" style="fill:var(--text-primary)"/>
<circle id="fm" r="7" fill="none" stroke-width="2.5"/>
</svg>
<div style="margin-top:8px"><button id="play"><i class="ti ti-player-play" aria-hidden="true"></i> Play price</button></div>
<p id="out" style="font-size:14px;margin:12px 0 0;line-height:1.6;color:var(--text-primary)"></p>
</div>
<script>
const P={calm:[0,-2,-4,-5,-8,-10,-12,-15,-17,-18,-20,-19,-17,-14,-10,-6,-2,2,6,9,12,15,18,20,22,24,25,24,22,20,18,16,15,13,12,11,10,10,9,10],news:[0,-2,-3,-4,-5,-4,-3,-2,-3,-4,-3,-2,-3,-4,-3,-4,-3,-35,-30,-28,-25,-22,-20,-15,-10,-5,0,5,10,15,18,20,22,20,18,19,20,21,20,22]};
const O={mb:{s:1,t:"m",n:"Market buy"},bl:{s:1,t:"l",n:"Buy limit",d:-15},bs:{s:1,t:"s",n:"Buy stop",d:15},sl:{s:-1,t:"l",n:"Sell limit",d:15},ss:{s:-1,t:"s",n:"Sell stop",d:-15}};
let k="bl",sc="calm",shown=39,timer=null;
const $=i=>document.getElementById(i),px=p=>(1.085+p*0.0001).toFixed(5),X=i=>64+i*556/39,Y=p=>20+(30-p)/70*220;
let gh="";[-30,-15,0,15,30].forEach(g=>{gh+=`<line x1="64" x2="620" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--border)" stroke-width="0.5"/><text x="58" y="${Y(g)+4}" text-anchor="end" font-size="11" style="fill:var(--text-secondary)">${px(g)}</text>`});
$("grid").innerHTML=gh;$("sl0").setAttribute("y1",Y(0));$("sl0").setAttribute("y2",Y(0));
function valid(){const o=O[k],L=+$("lv").value;if(o.t==="m")return true;return o.t==="l"?(o.s>0?L<0:L>0):(o.s>0?L>0:L<0)}
function sim(){const o=O[k],L=+$("lv").value,p=P[sc];if(o.t==="m")return{i:0,f:.5,slip:0};
for(let i=1;i<40;i++){const a=p[i]+.5,b=p[i]-.5,g=Math.abs(p[i]-p[i-1])>5,q=o.s>0?a:b;
const hit=o.t==="l"?(o.s>0?a<=L:b>=L):(o.s>0?a>=L:b<=L);
if(hit){const f=g?q:L;return{i,f,slip:(f-L)*o.s}}}return null}
function msg(){const o=O[k],L=+$("lv").value,p=P[sc];
if(!valid()){if(o.t==="l")return o.s>0?"A buy limit has to sit below the current price, because it means “buy only if it gets cheaper”. Drag the slider below the dashed start line.":"A sell limit has to sit above the current price, because it means “sell only if it gets dearer”. Drag the slider above the dashed start line.";
return o.s>0?"A buy stop has to sit above the current price, because it means “buy once the price has risen to here”. Drag the slider above the dashed start line.":"A sell stop has to sit below the current price, because it means “sell once the price has fallen to here”. This is how a stop-loss on a buy trade works. Drag the slider below the dashed start line."}
const r=sim();if(!r)return`Price never reached ${px(L)}, so your order never filled. That's the risk with pending orders: you can simply miss the move.`;
let m=o.t==="m"?`Filled straight away at ${px(r.f)}, the ask. You got a guaranteed fill, but you didn't choose the price.`:`Filled at ${px(r.f)}.`;
if(o.t!=="m"){if(r.slip>.1)m+=` Price jumped straight past ${px(L)}, so you got ${r.slip.toFixed(1)} pips worse than you asked. That's slippage: once triggered, a stop becomes a market order and takes the next price available.`;
else if(r.slip<-.1)m+=` Price jumped straight past ${px(L)}. A limit order never fills worse than your price, so you got ${(-r.slip).toFixed(1)} pips better.`;else m+=" That's exactly the price you set."}
const e=p[39],pnl=o.s>0?(e-.5)-r.f:r.f-(e+.5);m+=` By the end of the chart, this trade is ${pnl>=0?"+":""}${pnl.toFixed(1)} pips.`;return m}
function draw(){const o=O[k],L=+$("lv").value,p=P[sc],ok=valid(),col=o.s>0?"#1D9E75":"#D85A30";
document.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
document.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sc));
$("lvo").textContent=o.t==="m"?"Now":px(L);
$("pl").setAttribute("points",p.slice(0,shown+1).map((v,i)=>X(i)+","+Y(v)).join(" "));
$("cd").setAttribute("cx",X(shown));$("cd").setAttribute("cy",Y(p[shown]));
const ol=$("ol"),t=$("olt");
if(o.t==="m"){ol.style.display="none";t.textContent=""}else{ol.style.display="";ol.setAttribute("y1",Y(L));ol.setAttribute("y2",Y(L));ol.setAttribute("stroke",col);ol.setAttribute("stroke-dasharray",ok?"":"6 4");t.setAttribute("y",Y(L)-6);t.setAttribute("fill",col);t.textContent=o.n+" "+px(L)}
const r=ok?sim():null,fm=$("fm");
if(r&&r.i<=shown){fm.style.display="";fm.setAttribute("cx",X(r.i));fm.setAttribute("cy",Y(r.f));fm.setAttribute("stroke",col)}else fm.style.display="none";
$("out").textContent=shown<39?"Watching the price…":msg()}
function reset(){clearInterval(timer);shown=39;draw()}
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{k=b.dataset.k;if(O[k].d!==undefined)$("lv").value=O[k].d;reset()});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sc=b.dataset.s;reset()});
$("lv").oninput=reset;
$("play").onclick=()=>{clearInterval(timer);if(matchMedia("(prefers-reduced-motion: reduce)").matches){shown=39;draw();return}shown=0;draw();timer=setInterval(()=>{shown++;draw();if(shown>=39)clearInterval(timer)},70)};
draw();
</script>
